<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigo Secreto Familiar</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; max-width: 400px; margin: auto; text-align: center; background-color: #f7f9fc; color: #333; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 20px; }
    select, button { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #218838; }
    .resultado { margin-top: 20px; padding: 15px; background-color: #e9ecef; border-radius: 8px; }
    .bloqueado { background-color: #f8d7da; color: #721c24; padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 14px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>🎁 Amigo Secreto Familiar 🎁</h2>

  <div class="card">
    <label for="select-persona"><b>¿Quién eres?</b></label>
    <select id="select-persona">
      <option value="">-- Selecciona tu nombre --</option>
    </select>
    
    <button id="btn-revelar" onclick="revelarAmigo()">Ver mi Amigo Secreto</button>

    <div id="resultado" class="resultado" style="display:none;">
      <p style="margin:0; font-size: 14px; color: #6c757d;">Te tocó regalarle a:</p>
      <h1 id="nombre-asignado" style="color: #d9534f; margin: 10px 0 0 0;"></h1>
    </div>

    <div id="mensaje-bloqueo" class="bloqueado" style="display:none;"></div>
  </div>

  <script>
    // 1. LISTA DE PARTICIPANTES
    const participantes = ["Mamá Yubellka", "Buelo", "Neil", "Frank", "Zoe", "Brenda", "Mateo", "Nia", "Roxana"];

    // 2. CLAVE DEL SORTEO
    const ID_SORTEO = "2026_V1"; 

    // Generador matemático reproducible
    function crearRandom(semilla) {
      let hash = 0;
      for (let i = 0; i < semilla.length; i++) {
        hash = semilla.charCodeAt(i) + ((hash << 5) - hash);
      }
      return function() {
        let x = Math.sin(hash++) * 10000;
        return x - Math.floor(x);
      };
    }

    function realizarSorteoMatematico(lista, clave) {
      let rng = crearRandom(clave);
      let receptores = [...lista];
      let resultado = {};
      let valido = false;

      while (!valido) {
        receptores.sort(() => rng() - 0.5);
        valido = true;
        for (let i = 0; i < lista.length; i++) {
          if (lista[i] === receptores[i]) {
            valido = false;
            break;
          }
        }
      }

      for (let i = 0; i < lista.length; i++) {
        resultado[lista[i]] = receptores[i];
      }
      return resultado;
    }

    const asignaciones = realizarSorteoMatematico(participantes, ID_SORTEO);

    // Cargar selector de nombres
    const select = document.getElementById("select-persona");
    participantes.slice().sort().forEach(persona => {
      let option = document.createElement("option");
      option.value = persona;
      option.textContent = persona;
      select.appendChild(option);
    });

    // Comprobar si este dispositivo ya registró una identidad previamente
    const usuarioRegistrado = localStorage.getItem('usuario_amigo_secreto_' + ID_SORTEO);

    if (usuarioRegistrado) {
      select.value = usuarioRegistrado;
      select.disabled = true; // Bloquea el menú desplegable
      document.getElementById("mensaje-bloqueo").textContent = "Hacer trampa es malo y quita la emoción del juego, no seas chismoso 😉";
      document.getElementById("mensaje-bloqueo").style.display = "block";
    }

    function revelarAmigo() {
      const personaSeleccionada = select.value;

      if (!personaSeleccionada) {
        alert("Por favor selecciona tu nombre de la lista");
        return;
      }

      // Si es la primera vez que consulta desde este teléfono, guardamos su identidad
      if (!usuarioRegistrado) {
        localStorage.setItem('usuario_amigo_secreto_' + ID_SORTEO, personaSeleccionada);
        select.disabled = true;
        document.getElementById("mensaje-bloqueo").textContent = "Hacer trampa es malo y quita la emoción del juego, no seas chismoso 😉";
        document.getElementById("mensaje-bloqueo").style.display = "block";
      } else if (usuarioRegistrado !== personaSeleccionada) {
        alert("Hacer trampa es malo y quita la emoción del juego, no seas chismoso 😉");
        return;
      }

      document.getElementById("nombre-asignado").textContent = asignaciones[personaSeleccionada];
      document.getElementById("resultado").style.display = "block";
    }
  </script>
</body>
</html>
